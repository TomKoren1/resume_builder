# Bootstrapped once via `kubectl apply -f argocd/application.yaml` (ArgoCD
# has to exist before it can sync itself from git - not worth an "app of
# apps" for a single application). After that, ArgoCD is the only thing
# that applies changes to the resume-builder release; this file living in
# git is what makes that reproducible.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: resume-builder
  namespace: argocd
  annotations:
    # Push to Slack (via the webhook notifier in argocd/values.yaml) when a
    # sync fails or the app goes Degraded - both were previously silent.
    notifications.argoproj.io/subscribe.on-sync-failed.slack: ""
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ""
spec:
  project: default
  source:
    repoURL: https://github.com/TomKoren1/resume_builder.git
    targetRevision: main
    path: helm/resume-builder
    helm:
      # values.yaml (app config) is always loaded as the chart's base -
      # this just layers the observability-stack config on top of it.
      valueFiles:
        - values-monitoring.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: resume-builder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
