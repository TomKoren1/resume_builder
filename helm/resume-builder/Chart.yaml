apiVersion: v2
name: resume-builder
description: AI Resume Builder with Frontend, Backend, and Observability
type: application
version: 0.1.0
appVersion: "1.0.0"

# No dependencies. The observability stack used to be three subcharts here,
# which meant this project's release owned the platform every project on the
# cluster depends on - so it could not be the platform for two of them. It now
# lives in its own chart and its own namespace; see helm/monitoring/README.md
# for which copy is active.
#
# This chart still ships its own Grafana dashboard, from its own namespace, via
# templates/grafana-dashboard-configmap.yaml. The Grafana sidecar is configured
# with searchNamespace: ALL, so it is found wherever it lives.