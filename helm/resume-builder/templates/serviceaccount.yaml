apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "resume-builder.fullname" . }}-backend-sa
  {{- if .Values.backend.irsaRoleArn }}
  annotations:
    # Only meaningful on EKS - this role is assumed by pods using this
    # ServiceAccount via IRSA. Omitted entirely on clusters without it
    # (e.g. k3s), where Bedrock calls fail and main.py falls back to the
    # direct Anthropic API instead.
    eks.amazonaws.com/role-arn: {{ .Values.backend.irsaRoleArn | quote }}
  {{- end }}