# helm/resume-builder/values.yaml
#
# App-specific config only (backend/frontend/ingress). Observability stack
# config (Grafana/Prometheus/Loki/Alertmanager) lives in
# values-monitoring.yaml - see argocd/application.yaml's
# spec.source.helm.valueFiles for how both get applied together.

# Custom App Settings
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-backend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-4037283" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 8000
  persistence:
    size: 1Gi
  env:
    awsRegion: "us-east-1"
    # ANTHROPIC_API_KEY / RESUME_EMAIL / RESUME_PHONE / SLACK_WEBHOOK /
    # SESSION_SECRET_KEY / API_KEY_ENCRYPTION_KEY / GOOGLE_CLIENT_ID /
    # GOOGLE_CLIENT_SECRET / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET come
    # from the SealedSecret in templates/backend-sealedsecret.yaml, never
    # from here.
  # irsaRoleArn: only meaningful on EKS - leave unset on k3s (see serviceaccount.yaml)
  # Flipped to "true" now that Cloudflare Tunnel fronts resume.resume-4u.com
  # with real HTTPS (verified live end-to-end before this change landed).
  # Login over plain-HTTP resume.local stops working from here on -
  # browsers silently drop Secure cookies over HTTP, by design; that's
  # fine, resume.resume-4u.com is the real path going forward.
  sessionCookieSecure: "true"
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-frontend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-5d2ad8a" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 80
ingress:
  hosts:
    - resume.local
    - resume.resume-4u.com
cloudflared:
  image:
    repository: cloudflare/cloudflared
    tag: "2026.8.3" # pin exact version deliberately - bump by hand when wanted, not via --no-autoupdate
