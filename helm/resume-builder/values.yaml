# helm/resume-builder/values.yaml
#
# App-specific config only (backend/frontend/ingress). Observability stack
# config (Grafana/Prometheus/Loki/Alertmanager) lives in
# values-monitoring.yaml - see argocd/application.yaml's
# spec.source.helm.valueFiles for how both get applied together.

# Custom App Settings
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-backend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-0ce9405" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 8000
  persistence:
    size: 1Gi
  env:
    awsRegion: "us-east-1"
    # ANTHROPIC_API_KEY / RESUME_EMAIL / RESUME_PHONE / SLACK_WEBHOOK come from
    # the SealedSecret in templates/backend-sealedsecret.yaml, never from here.
  # irsaRoleArn: only meaningful on EKS - leave unset on k3s (see serviceaccount.yaml)
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-frontend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-0ce9405" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 80
ingress:
  host: resume.local
