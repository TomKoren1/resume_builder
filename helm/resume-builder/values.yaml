# helm/resume-builder/values.yaml
#
# App-specific config only (backend/frontend/ingress). Observability stack
# config (Grafana/Prometheus/Loki/Alertmanager) lives in
# values-monitoring.yaml - see argocd/application.yaml's
# spec.source.helm.valueFiles for how both get applied together.

# Custom App Settings
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-backend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-a3493e3" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 8000
  persistence:
    size: 1Gi
  env:
    awsRegion: "us-east-1"
    # ANTHROPIC_API_KEY / RESUME_EMAIL / RESUME_PHONE / SLACK_WEBHOOK /
    # SESSION_SECRET_KEY / API_KEY_ENCRYPTION_KEY / GOOGLE_CLIENT_ID /
    # GOOGLE_CLIENT_SECRET / GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET come
    # from the SealedSecret in templates/backend-sealedsecret.yaml, never
    # from here.
  # irsaRoleArn: only meaningful on EKS - leave unset on k3s (see serviceaccount.yaml)
  # Must stay "false" until Cloudflare Tunnel fronts this with real HTTPS
  # (Phase 4 of the public-multi-user plan) - browsers silently drop
  # Secure cookies over plain HTTP (what Tailscale/.local serves today).
  sessionCookieSecure: "false"
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/tomkoren1/resume-frontend # built + pushed by .github/workflows/build-and-deploy.yml
    tag: "sha-6052f35" # bumped automatically by CI - do not edit by hand
    pullPolicy: IfNotPresent
  service:
    port: 80
ingress:
  host: resume.local
