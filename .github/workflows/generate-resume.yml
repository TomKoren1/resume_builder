name: Generate Resume

on:
  push:
    branches: [main]
    paths:
      - "app/job_description.txt"
  workflow_dispatch: {}

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Tailor resume (Bedrock, falls back to Anthropic API)
        env:
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/main.py

      - name: Render resume PDF
        env:
          RESUME_EMAIL: ${{ secrets.RESUME_EMAIL }}
          RESUME_PHONE: ${{ secrets.RESUME_PHONE }}
        run: python app/render_resume.py app/tailored_resume.json app/template.html app/output.pdf

      - name: Upload resume PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: app/output.pdf
