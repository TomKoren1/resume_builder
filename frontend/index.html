<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="tabs">
        <button class="tab-btn active" data-view="generate">Generate</button>
        <button class="tab-btn" data-view="history">History</button>
        <button class="tab-btn" data-view="edit">Edit Master Resume</button>
    </nav>

    <main>
        <section id="view-generate" class="view active">
            <div class="container">
                <h2>Generate Tailored Resume</h2>
                <form id="resumeForm">
                    <label for="jobDescription">Target Job Description:</label>
                    <textarea id="jobDescription" required placeholder="Paste the job description here..."></textarea>
                    <button type="submit">Generate Resume</button>
                </form>
                <div id="response"></div>
            </div>
        </section>

        <section id="view-history" class="view">
            <div class="container wide">
                <h2>Generation History</h2>
                <div id="historyList" class="history-list">Loading...</div>
            </div>
        </section>

        <section id="view-edit" class="view">
            <div class="container wide">
                <h2>Edit Master Resume</h2>
                <div id="editStatus"></div>
                <form id="masterResumeForm"></form>

                <h3>Version History</h3>
                <div id="versionList" class="version-list">Loading...</div>
            </div>
        </section>

        <section id="view-history-edit" class="view">
            <div class="container wide">
                <button type="button" id="backToHistoryBtn" class="secondary">&larr; Back to History</button>
                <h2>Edit Resume</h2>
                <div id="historyEditStatus"></div>

                <h3>Sections</h3>
                <div id="sectionControls" class="section-controls"></div>

                <div id="historyEditFields"></div>

                <div class="edit-actions">
                    <button type="button" id="saveHistoryBtn">Save</button>
                    <button type="button" id="saveAsHistoryBtn" class="secondary">Save As New</button>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
