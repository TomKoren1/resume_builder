<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Builder</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f4f4f9; padding: 2rem; display: flex; justify-content: center; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        textarea { width: 100%; height: 100px; margin-bottom: 1rem; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { background: #007bff; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background: #0056b3; }
        #response { margin-top: 1rem; padding: 1rem; background: #e9ecef; border-radius: 4px; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Generate Tailored Resume</h2>
        <form id="resumeForm">
            <label for="jobDescription">Target Job Description:</label>
            <textarea id="jobDescription" required placeholder="Paste the job description here..."></textarea>
            <button type="submit">Generate Resume</button>
        </form>
        <div id="response"></div>
    </div>

    <script>
        document.getElementById('resumeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = e.target.querySelector('button');
            const responseDiv = document.getElementById('response');
            const jobDesc = document.getElementById('jobDescription').value;
            
            btn.textContent = 'Generating...';
            btn.disabled = true;
            responseDiv.style.display = 'block';
            responseDiv.textContent = 'Contacting AWS Bedrock...';

            try {
                // Ensure this matches your Python backend's route and port
                const res = await fetch('http://localhost:8000/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ job_description: jobDesc })
                });

                const data = await res.json();
                responseDiv.textContent = data.message || JSON.stringify(data, null, 2);
            } catch (error) {
                responseDiv.textContent = `Error: ${error.message}`;
            } finally {
                btn.textContent = 'Generate Resume';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
