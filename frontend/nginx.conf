# Overrides nginx:alpine's default server block. Plain nginx sends no
# Cache-Control header at all for static files, which meant Cloudflare's
# edge (once the app went public - see argocd/README.md and the Phase 4
# Cloudflare Tunnel work) filled in its own default of ~4 hours for
# common static extensions like .js/.css, and browsers cache that same
# header too. For an app that redeploys the frontend as often as this one
# does, that's a real problem: a real change can sit invisible to anyone
# who already loaded the page (or to Cloudflare's edge) for hours.
#
# no-cache (not no-store) - the browser/edge still keeps a local copy,
# but must revalidate with a conditional GET (If-None-Match/If-Modified-
# Since) on every request rather than trusting a cached copy blindly.
# nginx answers those with a cheap 304 when the file's unchanged, so this
# costs a tiny round-trip, not a full re-download, in exchange for never
# serving stale JS/CSS/HTML again.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
